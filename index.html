<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#080d20" />
    <title>Mighty Morphin Power Rangers — 恐龙战队</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <div id="screen">
        <canvas
          id="game"
          width="1280"
          height="720"
          aria-label="Power Rangers arcade game"
        ></canvas>

        <div id="hud" hidden>
          <section class="player-panel">
            <div id="portrait">⚡</div>
            <div class="player-info">
              <strong id="playerName"></strong>
              <div class="meter-row">
                <span id="hpLabel"></span>
                <div class="meter"><i id="hpFill"></i></div>
              </div>
              <div class="meter-row">
                <span id="powerLabel"></span>
                <div class="meter power"><i id="powerFill"></i></div>
              </div>
              <small id="livesLabel"></small>
            </div>
          </section>

          <section class="score-panel">
            <strong id="scoreLabel"></strong>
            <span id="stageLabel"></span>
            <button id="pauseButton" aria-label="Pause">Ⅱ</button>
          </section>

          <div id="bossBars"></div>
        </div>

        <div id="overlay">
          <div id="panel"></div>
        </div>

        <div id="toast" role="status"></div>
      </div>

      <div id="orientation-warning" hidden>
        <p>
          For the best gameplay experience, rotate your device to landscape.<br />
          为了获得更好的游戏体验，请将设备旋转为横屏。
        </p>
        <button id="dismissOrientation">Continue in Portrait / 继续竖屏</button>
      </div>

      <div id="touchControls" hidden>
        <div class="dpad">
          <button data-key="up" class="up" aria-label="Up">▲</button>
          <button data-key="left" class="left" aria-label="Left">◀</button>
          <button data-key="down" class="down" aria-label="Down">▼</button>
          <button data-key="right" class="right" aria-label="Right">▶</button>
        </div>
        <div class="actions">
          <button data-key="jump" class="jump">J</button>
          <button data-key="special" class="special">S</button>
          <button data-key="attack" class="attack">A</button>
          <button data-key="heavy" class="heavy">B</button>
          <button data-key="dash" class="dash">»</button>
        </div>
      </div>

      <footer>
        WASD / ↑↓←→ · J ATTACK · K HEAVY · L JUMP · I SPECIAL · SPACE DODGE · P
        PAUSE
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
